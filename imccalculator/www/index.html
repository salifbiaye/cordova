<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: https://ssl.gstatic.com https://cdnjs.cloudflare.com 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com; media-src *; img-src 'self' data: content:;">
    <title>Calculateur IMC</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/index.css">
</head>
<body>

<div id="app">

    <header>
        <div class="header-inner">
            <h1>Calculateur IMC</h1>
            <p class="subtitle">Évaluez votre composition corporelle en quelques secondes.</p>
        </div>
    </header>

    <div class="content">

        <form id="imc-form" novalidate>

            <div class="field-group">
                <div class="field">
                    <label for="masse">
                        <i class="fa-solid fa-weight-scale"></i>
                        Masse
                        <span class="unit">kg</span>
                    </label>
                    <input
                        type="number"
                        id="masse"
                        placeholder="70"
                        min="1" max="500" step="0.1"
                        inputmode="decimal"
                        required
                    >
                    <span class="field-hint">Entre 1 et 500 kg</span>
                </div>

                <div class="field-divider">/</div>

                <div class="field">
                    <label for="taille">
                        <i class="fa-solid fa-ruler-vertical"></i>
                        Taille
                        <span class="unit">m</span>
                    </label>
                    <input
                        type="number"
                        id="taille"
                        placeholder="1.75"
                        min="0.5" max="3" step="0.01"
                        inputmode="decimal"
                        required
                    >
                    <span class="field-hint">Entre 0.5 et 3 m</span>
                </div>
            </div>

            <button type="submit" class="btn-submit">
                <span>Calculer l'IMC</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>

        </form>

        <div id="result" class="result" aria-live="polite" hidden>
            <div class="result-ring">
                <svg class="ring-svg" viewBox="0 0 120 120">
                    <circle class="ring-bg"   cx="60" cy="60" r="50"/>
                    <circle class="ring-fill" cx="60" cy="60" r="50"/>
                </svg>
                <div class="result-value-wrap">
                    <span id="result-value"  class="result-value">--</span>
                    <span class="result-label-imc">IMC</span>
                </div>
            </div>
            <p id="result-category" class="result-category">--</p>
            <p id="result-advice"   class="result-advice"></p>
        </div>

    </div>
</div>

<script src="cordova.js"></script>
<script src="js/index.js"></script>
</body>
</html>
